<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#25D366"/>
      <stop offset="100%" style="stop-color:#128C7E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg1)"/>
  <!-- Phone frame -->
  <rect x="130" y="20" width="140" height="210" rx="14" fill="#0d1f35" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="175" y="24" width="50" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  <!-- Header -->
  <rect x="130" y="34" width="140" height="28" rx="0" fill="rgba(37,211,102,0.12)"/>
  <circle cx="148" cy="48" r="8" fill="url(#accent1)"/>
  <text x="162" y="46" fill="#fff" font-family="sans-serif" font-size="7" font-weight="600">Dental Clinic</text>
  <text x="162" y="55" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="5">Online</text>
  <!-- Chat bubbles -->
  <rect x="175" y="72" width="85" height="20" rx="8" fill="rgba(37,211,102,0.2)"/>
  <text x="182" y="82" fill="#25D366" font-family="sans-serif" font-size="5.5">Hi! I'd like to book an</text>
  <text x="182" y="90" fill="#25D366" font-family="sans-serif" font-size="5.5">appointment for tomorrow</text>
  <rect x="138" y="100" width="90" height="26" rx="8" fill="rgba(99,200,255,0.12)"/>
  <text x="145" y="110" fill="#63C8FF" font-family="sans-serif" font-size="5.5">🤖 Sure! What time works</text>
  <text x="145" y="118" fill="#63C8FF" font-family="sans-serif" font-size="5.5">best for you?</text>
  <rect x="185" y="136" width="75" height="16" rx="8" fill="rgba(37,211,102,0.2)"/>
  <text x="192" y="146" fill="#25D366" font-family="sans-serif" font-size="5.5">10:00 AM please</text>
  <rect x="138" y="160" width="95" height="30" rx="8" fill="rgba(99,200,255,0.12)"/>
  <text x="145" y="170" fill="#63C8FF" font-family="sans-serif" font-size="5.5">✅ Booked! Tuesday 10:00</text>
  <text x="145" y="178" fill="#63C8FF" font-family="sans-serif" font-size="5.5">AM. Confirmation SMS sent.</text>
  <text x="145" y="186" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="4.5">Read ✓✓</text>
  <!-- Input bar -->
  <rect x="138" y="200" width="110" height="16" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="148" y="210" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="5">Type a message...</text>
  <circle cx="260" cy="208" r="7" fill="url(#accent1)"/>
  <!-- Side stats -->
  <rect x="20" y="50" width="95" height="55" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text x="30" y="68" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5" font-weight="500">BOOKINGS TODAY</text>
  <text x="30" y="85" fill="#25D366" font-family="sans-serif" font-size="18" font-weight="700">24</text>
  <text x="63" y="85" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="6">/ 28</text>
  <rect x="280" y="50" width="100" height="55" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text x="290" y="68" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5" font-weight="500">NO-SHOW RATE</text>
  <text x="290" y="85" fill="#FB923C" font-family="sans-serif" font-size="18" font-weight="700">3.2%</text>
  <text x="328" y="85" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="5">↓ from 8%</text>
  <!-- Bottom bar chart -->
  <rect x="20" y="130" width="95" height="95" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text x="30" y="148" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5" font-weight="500">WEEKLY BOOKINGS</text>
  <rect x="28" y="195" width="10" height="18" rx="2" fill="rgba(37,211,102,0.3)"/>
  <rect x="42" y="185" width="10" height="28" rx="2" fill="rgba(37,211,102,0.4)"/>
  <rect x="56" y="180" width="10" height="33" rx="2" fill="rgba(37,211,102,0.5)"/>
  <rect x="70" y="172" width="10" height="41" rx="2" fill="rgba(37,211,102,0.6)"/>
  <rect x="84" y="168" width="10" height="45" rx="2" fill="#25D366"/>
  <rect x="98" y="175" width="10" height="38" rx="2" fill="rgba(37,211,102,0.5)"/>
  <!-- Bottom right stats -->
  <rect x="280" y="130" width="100" height="95" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text x="290" y="148" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5" font-weight="500">REMINDERS SENT</text>
  <text x="290" y="175" fill="#63C8FF" font-family="sans-serif" font-size="22" font-weight="700">1,247</text>
  <text x="290" y="190" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="5">this month</text>
  <rect x="290" y="200" width="80" height="3" rx="1.5" fill="rgba(255,255,255,0.06)"/>
  <rect x="290" y="200" width="60" height="3" rx="1.5" fill="#63C8FF" opacity="0.6"/>
</svg>
