<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1a2e"/>
      <stop offset="100%" style="stop-color:#162040"/>
    </linearGradient>
    <linearGradient id="voice" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#63C8FF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg2)"/>
  <!-- Phone frame -->
  <rect x="145" y="15" width="110" height="220" rx="12" fill="#0d1f35" stroke="rgba(168,85,247,0.2)" stroke-width="1"/>
  <rect x="180" y="19" width="40" height="3" rx="1.5" fill="rgba(255,255,255,0.12)"/>
  <!-- Call screen -->
  <text x="177" y="45" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="6">Incoming Call</text>
  <circle cx="200" cy="72" r="22" fill="none" stroke="url(#voice)" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="200" cy="72" r="16" fill="rgba(168,85,247,0.15)"/>
  <text x="193" y="77" fill="#A855F7" font-family="sans-serif" font-size="12">🤖</text>
  <text x="200" y="108" fill="#fff" font-family="sans-serif" font-size="7" font-weight="600">AI Receptionist</text>
  <text x="200" y="118" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="5">Active Call: 2m 34s</text>
  <!-- Waveform -->
  <g transform="translate(160, 128)">
    <rect x="0" y="5" width="3" height="8" rx="1" fill="rgba(168,85,247,0.4)"/>
    <rect x="6" y="2" width="3" height="14" rx="1" fill="rgba(168,85,247,0.5)"/>
    <rect x="12" y="0" width="3" height="18" rx="1" fill="rgba(168,85,247,0.6)"/>
    <rect x="18" y="3" width="3" height="12" rx="1" fill="rgba(168,85,247,0.7)"/>
    <rect x="24" y="1" width="3" height="16" rx="1" fill="#A855F7"/>
    <rect x="30" y="4" width="3" height="10" rx="1" fill="rgba(168,85,247,0.6)"/>
    <rect x="36" y="2" width="3" height="14" rx="1" fill="rgba(168,85,247,0.5)"/>
    <rect x="42" y="6" width="3" height="6" rx="1" fill="rgba(168,85,247,0.4)"/>
    <rect x="48" y="3" width="3" height="12" rx="1" fill="rgba(168,85,247,0.5)"/>
    <rect x="54" y="5" width="3" height="8" rx="1" fill="rgba(168,85,247,0.3)"/>
  </g>
  <!-- Transcript -->
  <rect x="155" y="155" width="90" height="18" rx="5" fill="rgba(168,85,247,0.1)"/>
  <text x="162" y="166" fill="#A855F7" font-family="sans-serif" font-size="5">"I'd like to schedule a viewing</text>
  <text x="162" y="172" fill="#A855F7" font-family="sans-serif" font-size="5"> for the Marina property"</text>
  <rect x="155" y="178" width="90" height="16" rx="5" fill="rgba(99,200,255,0.08)"/>
  <text x="162" y="188" fill="#63C8FF" font-family="sans-serif" font-size="5">"Great! I have Saturday 2PM"</text>
  <!-- Call controls -->
  <circle cx="170" cy="210" r="9" fill="rgba(248,113,113,0.2)"/>
  <text x="167" y="213" fill="#F87171" font-family="sans-serif" font-size="8">📞</text>
  <circle cx="200" cy="210" r="9" fill="rgba(37,211,102,0.2)"/>
  <text x="197" y="213" fill="#25D366" font-family="sans-serif" font-size="8">🔊</text>
  <circle cx="230" cy="210" r="9" fill="rgba(255,255,255,0.08)"/>
  <text x="227" y="213" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">🎤</text>
  <!-- Side panels -->
  <rect x="15" y="25" width="115" height="50" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text x="25" y="42" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5">CALLS TODAY</text>
  <text x="25" y="60" fill="#A855F7" font-family="sans-serif" font-size="16" font-weight="700">47</text>
  <text x="52" y="60" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="5">handled</text>
  <rect x="270" y="25" width="115" height="50" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text x="280" y="42" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5">BOOKINGS MADE</text>
  <text x="280" y="60" fill="#34D399" font-family="sans-serif" font-size="16" font-weight="700">31</text>
  <text x="303" y="60" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="5">today</text>
  <rect x="15" y="90" width="115" height="140" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text x="25" y="108" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5">RECENT CALLS</text>
  <text x="25" y="124" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="5">+1 (555) 234-8901</text>
  <text x="25" y="133" fill="#34D399" font-family="sans-serif" font-size="4.5">Booked · 2m 12s</text>
  <line x1="25" y1="138" x2="125" y2="138" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <text x="25" y="150" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="5">+1 (555) 876-5432</text>
  <text x="25" y="159" fill="#34D399" font-family="sans-serif" font-size="4.5">Booked · 3m 45s</text>
  <line x1="25" y1="164" x2="125" y2="164" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <text x="25" y="176" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="5">+1 (555) 345-6789</text>
  <text x="25" y="185" fill="#FB923C" font-family="sans-serif" font-size="4.5">Info · 1m 30s</text>
  <line x1="25" y1="190" x2="125" y2="190" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <text x="25" y="202" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="5">+1 (555) 901-2345</text>
  <text x="25" y="211" fill="#34D399" font-family="sans-serif" font-size="4.5">Booked · 2m 58s</text>
  <rect x="270" y="90" width="115" height="140" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text x="280" y="108" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5">RESPONSE TIME</text>
  <text x="280" y="138" fill="#63C8FF" font-family="sans-serif" font-size="24" font-weight="700">0.8s</text>
  <text x="280" y="150" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="5">avg answer speed</text>
  <rect x="280" y="162" width="95" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
  <rect x="280" y="162" width="85" height="4" rx="2" fill="url(#voice)" opacity="0.5"/>
  <text x="280" y="185" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="5">vs 6.2s manual</text>
  <text x="280" y="210" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="5">3.6x more qualified leads</text>
</svg>
