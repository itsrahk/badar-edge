<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg9)"/>
  <text x="20" y="28" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="6" font-weight="600">REVIEW REQUEST AUTOMATION</text>
  <!-- Email mockup -->
  <rect x="20" y="40" width="180" height="120" rx="8" fill="#0f1a2e" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <rect x="20" y="40" width="180" height="20" rx="8" fill="rgba(99,200,255,0.06)"/>
  <text x="30" y="54" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="4.5">From: smiles@dentalclinic.com</text>
  <text x="30" y="72" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="5" font-weight="600">How was your visit, Sarah?</text>
  <text x="30" y="84" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="4">We'd love to hear about your experience</text>
  <text x="30" y="92" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="4">at Downtown Dental...</text>
  <!-- Star rating -->
  <text x="75" y="112" fill="#FB923C" font-family="sans-serif" font-size="12">★★★★★</text>
  <text x="95" y="128" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="4.5" text-anchor="middle">Rate us on Google</text>
  <!-- Button -->
  <rect x="60" y="135" width="100" height="16" rx="8" fill="rgba(99,200,255,0.2)"/>
  <text x="110" y="146" fill="#63C8FF" font-family="sans-serif" font-size="5" font-weight="600" text-anchor="middle">Leave a Review →</text>
  <!-- WhatsApp mockup -->
  <rect x="215" y="40" width="170" height="120" rx="8" fill="#0f1a2e" stroke="rgba(52,211,153,0.15)" stroke-width="0.5"/>
  <rect x="215" y="40" width="170" height="18" rx="8" fill="rgba(52,211,153,0.08)"/>
  <text x="225" y="53" fill="#34D399" font-family="sans-serif" font-size="5">WhatsApp — Auto Message</text>
  <rect x="225" y="64" width="120" height="22" rx="6" fill="rgba(52,211,153,0.1)"/>
  <text x="232" y="74" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="4">Hi Sarah! Thanks for visiting</text>
  <text x="232" y="82" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="4">today. Quick review? 🙏</text>
  <rect x="290" y="92" width="80" height="18" rx="6" fill="rgba(52,211,153,0.15)"/>
  <text x="330" y="104" fill="#34D399" font-family="sans-serif" font-size="5" text-anchor="middle">⭐ Review Us</text>
  <rect x="225" y="116" width="100" height="16" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="232" y="127" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="4">Delivered · Read ✓✓</text>
  <!-- Bottom stats -->
  <rect x="20" y="175" width="115" height="60" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text x="30" y="193" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5">GOOGLE REVIEWS</text>
  <text x="30" y="215" fill="#FB923C" font-family="sans-serif" font-size="20" font-weight="700">180+</text>
  <text x="80" y="215" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="5">reviews</text>
  <text x="30" y="228" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="4">↑ from 12 in 90 days</text>
  <rect x="150" y="175" width="115" height="60" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text x="160" y="193" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5">AVG RATING</text>
  <text x="160" y="215" fill="#FB923C" font-family="sans-serif" font-size="20" font-weight="700">4.9</text>
  <text x="188" y="215" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="5">/ 5.0</text>
  <text x="160" y="228" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="4">5-star dominant</text>
  <rect x="280" y="175" width="105" height="60" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text x="290" y="193" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5">RESPONSE RATE</text>
  <text x="290" y="215" fill="#34D399" font-family="sans-serif" font-size="20" font-weight="700">68%</text>
  <text x="322" y="215" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="5">click rate</text>
  <text x="290" y="228" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="4">Email + WhatsApp combined</text>
</svg>
