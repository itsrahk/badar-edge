<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1a2e"/>
      <stop offset="100%" style="stop-color:#162040"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <text x="20" y="28" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="6" font-weight="600">EMAIL MARKETING CRM</text>
  <rect x="20" y="40" width="360" height="195" rx="8" fill="#0d1527" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <rect x="20" y="40" width="360" height="16" rx="8" fill="rgba(255,255,255,0.03)"/>
  <circle cx="32" cy="48" r="3" fill="#F87171" opacity="0.6"/>
  <circle cx="42" cy="48" r="3" fill="#FB923C" opacity="0.6"/>
  <circle cx="52" cy="48" r="3" fill="#34D399" opacity="0.6"/>
  <!-- Campaign list -->
  <text x="30" y="68" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5" font-weight="500">CAMPAIGNS</text>
  <!-- Campaign 1 -->
  <rect x="30" y="76" width="340" height="32" rx="5" fill="rgba(52,211,153,0.04)" stroke="rgba(52,211,153,0.08)" stroke-width="0.5"/>
  <text x="40" y="90" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="4.5" font-weight="600">Summer Sale Blast</text>
  <text x="40" y="102" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="3.5">Sent to 12,450 • Open rate: 42% • Click rate: 18%</text>
  <text x="340" y="90" fill="#34D399" font-family="sans-serif" font-size="3.5" font-weight="600">ACTIVE</text>
  <!-- Campaign 2 -->
  <rect x="30" y="112" width="340" height="32" rx="5" fill="rgba(99,200,255,0.04)" stroke="rgba(99,200,255,0.08)" stroke-width="0.5"/>
  <text x="40" y="126" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="4.5" font-weight="600">Weekly Newsletter #42</text>
  <text x="40" y="138" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="3.5">Sent to 8,200 • Open rate: 38% • Click rate: 12%</text>
  <text x="340" y="126" fill="#63C8FF" font-family="sans-serif" font-size="3.5" font-weight="600">SENT</text>
  <!-- Campaign 3 -->
  <rect x="30" y="148" width="340" height="32" rx="5" fill="rgba(168,85,247,0.04)" stroke="rgba(168,85,247,0.08)" stroke-width="0.5"/>
  <text x="40" y="162" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="4.5" font-weight="600">Product Launch Reminder</text>
  <text x="40" y="174" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="3.5">Scheduled for Aug 20 • 5,600 recipients</text>
  <text x="340" y="162" fill="#A855F7" font-family="sans-serif" font-size="3.5" font-weight="600">DRAFT</text>
  <!-- Funnel visualization -->
  <text x="30" y="200" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5" font-weight="500">CONVERSION FUNNEL</text>
  <rect x="30" y="208" width="340" height="10" rx="5" fill="rgba(99,200,255,0.15)"/>
  <text x="200" y="216" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="4" text-anchor="middle">12,450 Sent</text>
  <rect x="55" y="222" width="290" height="10" rx="5" fill="rgba(168,85,247,0.15)"/>
  <text x="200" y="230" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="4" text-anchor="middle">5,229 Opened (42%)</text>
  <rect x="95" y="236" width="210" height="10" rx="5" fill="rgba(52,211,153,0.15)"/>
  <text x="200" y="244" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="4" text-anchor="middle">2,241 Clicked (18%)</text>
</svg>
