<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1a2e"/>
      <stop offset="100%" style="stop-color:#162040"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <text x="20" y="28" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="6" font-weight="600">MICROSERVICES ARCHITECTURE</text>
  <rect x="20" y="40" width="360" height="195" rx="8" fill="#0d1527" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <rect x="20" y="40" width="360" height="16" rx="8" fill="rgba(255,255,255,0.03)"/>
  <circle cx="32" cy="48" r="3" fill="#F87171" opacity="0.6"/>
  <circle cx="42" cy="48" r="3" fill="#FB923C" opacity="0.6"/>
  <circle cx="52" cy="48" r="3" fill="#34D399" opacity="0.6"/>
  <text x="30" y="68" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5" font-weight="500">SERVICE MAP</text>
  <!-- API Gateway -->
  <rect x="155" y="76" width="90" height="24" rx="5" fill="rgba(99,200,255,0.1)" stroke="rgba(99,200,255,0.2)" stroke-width="0.5"/>
  <text x="200" y="92" fill="#63C8FF" font-family="sans-serif" font-size="4.5" text-anchor="middle" font-weight="600">API Gateway</text>
  <!-- Lines to services -->
  <line x1="175" y1="100" x2="65" y2="120" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <line x1="190" y1="100" x2="145" y2="120" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <line x1="210" y1="100" x2="245" y2="120" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <line x1="225" y1="100" x2="335" y2="120" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <!-- Services -->
  <rect x="30" y="120" width="70" height="24" rx="5" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.15)" stroke-width="0.5"/>
  <text x="65" y="136" fill="#34D399" font-family="sans-serif" font-size="3.5" text-anchor="middle">Auth Service</text>
  <rect x="110" y="120" width="70" height="24" rx="5" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.15)" stroke-width="0.5"/>
  <text x="145" y="136" fill="#A855F7" font-family="sans-serif" font-size="3.5" text-anchor="middle">User Service</text>
  <rect x="210" y="120" width="70" height="24" rx="5" fill="rgba(251,146,60,0.08)" stroke="rgba(251,146,60,0.15)" stroke-width="0.5"/>
  <text x="245" y="136" fill="#FB923C" font-family="sans-serif" font-size="3.5" text-anchor="middle">Order Service</text>
  <rect x="300" y="120" width="70" height="24" rx="5" fill="rgba(248,113,113,0.08)" stroke="rgba(248,113,113,0.15)" stroke-width="0.5"/>
  <text x="335" y="136" fill="#F87171" font-family="sans-serif" font-size="3.5" text-anchor="middle">Payment Svc</text>
  <!-- Message Queue -->
  <rect x="100" y="160" width="200" height="20" rx="5" fill="rgba(99,200,255,0.06)" stroke="rgba(99,200,255,0.1)" stroke-width="0.5"/>
  <text x="200" y="174" fill="#63C8FF" font-family="sans-serif" font-size="4" text-anchor="middle">Message Queue (RabbitMQ)</text>
  <!-- Databases -->
  <rect x="30" y="192" width="70" height="20" rx="5" fill="rgba(52,211,153,0.06)"/>
  <text x="65" y="206" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="3.5" text-anchor="middle">PostgreSQL</text>
  <rect x="110" y="192" width="70" height="20" rx="5" fill="rgba(168,85,247,0.06)"/>
  <text x="145" y="206" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="3.5" text-anchor="middle">MongoDB</text>
  <rect x="210" y="192" width="70" height="20" rx="5" fill="rgba(251,146,60,0.06)"/>
  <text x="245" y="206" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="3.5" text-anchor="middle">Redis Cache</text>
  <rect x="300" y="192" width="70" height="20" rx="5" fill="rgba(248,113,113,0.06)"/>
  <text x="335" y="206" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="3.5" text-anchor="middle">S3 Storage</text>
  <text x="30" y="232" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5.5" font-weight="500">SYSTEM METRICS</text>
  <text x="30" y="244" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="4">Services: 12 • Containers: 48 • Uptime: 99.99% • Latency: 45ms p95 • Throughput: 2.4K req/s</text>
</svg>
