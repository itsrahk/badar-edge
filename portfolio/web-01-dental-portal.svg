  <text x="102" y="184" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="700">12</text>
  <text x="120" y="184" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="4">today</text>
  <text x="102" y="194" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="3.5">8 confirmed, 2 pending</text>
