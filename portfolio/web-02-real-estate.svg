  <rect x="155" y="210" width="30" height="10" rx="5" fill="rgba(168,85,247,0.1)"/>
  <text x="170" y="218" fill="#A855F7" font-family="sans-serif" font-size="3.5" text-anchor="middle">Details →</text>
  <!-- Property card 3 -->
  <rect x="264" y="112" width="105" height="115" rx="6" fill="rgba(251,146,60,0.04)" stroke="rgba(251,146,60,0.08)" stroke-width="0.5"/>
  <rect x="264" y="112" width="105" height="50" rx="6" fill="rgba(251,146,60,0.08)"/>
  <text x="316" y="142" fill="rgba(251,146,60,0.3)" font-family="sans-serif" font-size="12" text-anchor="middle">🏗️</text>
  <text x="272" y="172" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="5" font-weight="600">4 Bed House</text>
  <text x="272" y="182" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="4">Bahria Town, Rwp</text>
  <text x="272" y="194" fill="#34D399" font-family="sans-serif" font-size="6" font-weight="700">PKR 4.5 Cr</text>
  <text x="272" y="204" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="3.5">4 bed · 3 bath · 2800 sqft</text>
  <rect x="272" y="210" width="30" height="10" rx="5" fill="rgba(251,146,60,0.1)"/>
  <text x="287" y="218" fill="#FB923C" font-family="sans-serif" font-size="3.5" text-anchor="middle">Details →</text>
