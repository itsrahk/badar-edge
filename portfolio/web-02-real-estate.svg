<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1a2e"/>
      <stop offset="100%" style="stop-color:#142238"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <text x="20" y="28" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="6" font-weight="600">REAL ESTATE LISTINGS</text>
  <!-- Browser frame -->
  <rect x="20" y="40" width="360" height="195" rx="8" fill="#0d1527" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <rect x="20" y="40" width="360" height="16" rx="8" fill="rgba(255,255,255,0.03)"/>
  <circle cx="32" cy="48" r="3" fill="#F87171" opacity="0.6"/>
  <circle cx="42" cy="48" r="3" fill="#FB923C" opacity="0.6"/>
  <circle cx="52" cy="48" r="3" fill="#34D399" opacity="0.6"/>
  <!-- Search bar -->
  <rect x="30" y="64" width="340" height="20" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <text x="42" y="77" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="4">🔍 Search by location, price, beds...</text>
  <!-- Filters -->
  <rect x="30" y="90" width="55" height="14" rx="7" fill="rgba(99,200,255,0.12)"/>
