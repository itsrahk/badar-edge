  <text x="82" y="142" fill="rgba(99,200,255,0.3)" font-family="sans-serif" font-size="12" text-anchor="middle">🏠</text>
  <text x="38" y="172" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="5" font-weight="600">3 Bed Villa</text>
  <text x="38" y="182" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="4">DHA Phase 5, Lahore</text>
  <text x="38" y="194" fill="#34D399" font-family="sans-serif" font-size="6" font-weight="700">PKR 3.2 Cr</text>
  <text x="38" y="204" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="3.5">3 bed · 2 bath · 1800 sqft</text>
  <rect x="38" y="210" width="30" height="10" rx="5" fill="rgba(99,200,255,0.1)"/>
  <text x="53" y="218" fill="#63C8FF" font-family="sans-serif" font-size="3.5" text-anchor="middle">Details →</text>
  <!-- Property card 2 -->
  <rect x="147" y="112" width="105" height="115" rx="6" fill="rgba(168,85,247,0.04)" stroke="rgba(168,85,247,0.08)" stroke-width="0.5"/>
  <rect x="147" y="112" width="105" height="50" rx="6" fill="rgba(168,85,247,0.08)"/>
  <text x="199" y="142" fill="rgba(168,85,247,0.3)" font-family="sans-serif" font-size="12" text-anchor="middle">🏢</text>
  <text x="155" y="172" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="5" font-weight="600">2 Bed Flat</text>
  <text x="155" y="182" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="4">Gulberg III, Lahore</text>
  <text x="155" y="194" fill="#34D399" font-family="sans-serif" font-size="6" font-weight="700">PKR 1.8 Cr</text>
