  <rect x="90" y="90" width="55" height="14" rx="7" fill="rgba(255,255,255,0.04)"/>
  <text x="117" y="100" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="4" text-anchor="middle">For Rent</text>
  <rect x="150" y="90" width="55" height="14" rx="7" fill="rgba(168,85,247,0.12)"/>
  <text x="177" y="100" fill="#A855F7" font-family="sans-serif" font-size="4" text-anchor="middle">New</text>
  <rect x="210" y="90" width="70" height="14" rx="7" fill="rgba(255,255,255,0.04)"/>
  <text x="245" y="100" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="4" text-anchor="middle">Price: Max</text>
  <!-- Property card 1 -->
  <rect x="30" y="112" width="105" height="115" rx="6" fill="rgba(99,200,255,0.04)" stroke="rgba(99,200,255,0.08)" stroke-width="0.5"/>
