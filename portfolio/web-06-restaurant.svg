  <!-- Active orders panel -->
  <rect x="30" y="80" width="175" height="145" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text x="40" y="96" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="5.5" font-weight="600">LIVE ORDERS</text>
  <!-- Order 1 -->
