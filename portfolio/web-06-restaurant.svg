  <text x="265" y="118" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="4">orders completed</text>
  <rect x="225" y="130" width="135" height="20" rx="5" fill="rgba(99,200,255,0.06)"/>
  <text x="232" y="144" fill="#63C8FF" font-family="sans-serif" font-size="12" font-weight="700">PKR 285K</text>
  <text x="300" y="144" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="4">revenue</text>
  <rect x="225" y="156" width="135" height="20" rx="5" fill="rgba(168,85,247,0.06)"/>
  <text x="232" y="170" fill="#A855F7" font-family="sans-serif" font-size="12" font-weight="700">24 min</text>
  <text x="280" y="170" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="4">avg delivery</text>
