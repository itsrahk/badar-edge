  <text x="130" y="70" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="4">Orders</text>
  <text x="165" y="70" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="4">Reservations</text>
