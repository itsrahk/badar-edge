  <text x="225" y="194" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="5">CUSTOMER RATING</text>
  <text x="225" y="212" fill="#FB923C" font-family="sans-serif" font-size="16" font-weight="700">4.8</text>
  <text x="258" y="212" fill="#FB923C" font-family="sans-serif" font-size="8">★★★★★</text>
  <text x="225" y="222" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="3.5">Based on 89 reviews today</text>
